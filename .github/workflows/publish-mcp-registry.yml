# Publica server.json al Registro MCP oficial (registry.modelcontextprotocol.io).
# Manual (workflow_dispatch) — la identidad la prueba el OIDC del propio repo:
# el runner emite un id-token que certifica "esto corre en Maarmapa/storefront-mcp",
# y con eso el registro valida el namespace io.github.maarmapa. Sin secretos.
name: Publish to MCP Registry
on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token para mcp-publisher
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" | tar xz mcp-publisher
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
